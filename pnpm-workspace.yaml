allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Nadpisania zależności przechodnich z potwierdzonymi advisory (LSG-02). Każde mieści się w
# linii wersji używanej przez rodzica albo jest zweryfikowane buildem/lintem. Usuń wpis,
# gdy rodzic (miniflare, vinext, eslint-config-next, webpack) wyda wersję z poprawką.
overrides:
  undici@7: ^7.30.1
  postcss@8: ^8.5.33
  sharp: ^0.35.5
  ws@8: ^8.21.0
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  fast-uri@3: ^3.1.9
  image-size@2: ^2.0.3
  source-map-js@1: ^1.2.2
  zod@4: ^4.6.6
  satori: ^0.33.5
  fflate@0.7: ^0.7.5
  minimatch@10: ^11.0.1
  esbuild@<0.28.1: 0.28.2
